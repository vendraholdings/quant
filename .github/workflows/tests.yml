name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-14   # Apple Silicon runner (MLX needs arm64 macOS)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
